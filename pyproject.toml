[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ping-f-transfer"
version = "1.0.0"
description = "Transfer files over ICMP echo requests using ping"
license = "MIT"
requires-python = ">=3.8"

[project.scripts]
ping-f-transfer = "ping_f_transfer.cli:main"

[tool.setuptools.packages.find]
include = ["ping_f_transfer*"]
